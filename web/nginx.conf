server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx's default table lacks .mjs; browsers refuse a module worker (the map) served with the wrong type.
  include mime.types;
  types { text/javascript mjs; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Backend (FastAPI). Docker's DNS resolves "api" to the backend container.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx is the edge: replace, never append, so a client cannot spoof its address to dodge the rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location = /health {
    proxy_pass http://api:8000/health;
  }

  # Hashed build files never change, so browsers may cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
