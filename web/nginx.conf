# Cache of the API's answers. The data never changes while the server runs, so an answer for a URL is good for days; the cache lock makes
# 100 visitors asking for the same map at the same moment cost one query, not 100 (the rest wait for that one). Lives in the container:
# a redeploy starts it empty.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:50m max_size=3g inactive=7d use_temp_path=off;

# Per visitor: an ordinary page load is about 6 requests, so 20 a second with a burst of 60 is generous; the CSV of the fire cells (several MB) is
# limited much harder.
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=heavy:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=heavyconn:10m;

# Behind Caddy (or Docker's gateway) the address nginx sees is the proxy's; the visitor's is in X-Forwarded-For.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx's default table lacks .mjs; browsers refuse a module worker (the map) served with the wrong type.
  include mime.types;
  types { text/javascript mjs; }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json text/csv image/svg+xml;

  # The fire-cells CSV: a few MB, slow to make. At most 1 a second and 2 at once per visitor; cached like the rest.
  location = /api/export.csv {
    limit_req zone=heavy burst=3 nodelay;
    limit_conn heavyconn 2;
    limit_req_status 429;
    limit_conn_status 429;
    include /etc/nginx/api_proxy.conf;
  }

  # Backend (FastAPI). Docker's DNS resolves "api" to the backend container.
  location /api/ {
    limit_req zone=perip burst=60 nodelay;
    limit_req_status 429;
    include /etc/nginx/api_proxy.conf;
  }
  location = /health {
    proxy_pass http://api:8000/health;
  }

  # Hashed build files never change, so browsers may cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
