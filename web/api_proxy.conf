proxy_pass http://api:8000;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# nginx is the edge: replace, never append, so a client cannot spoof its address to dodge the rate limit.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;

# Only GET and HEAD are cached (the POST of the explain hook never is).
proxy_cache api;
proxy_cache_key "$request_uri";
proxy_cache_valid 200 7d;
proxy_cache_valid 404 422 1h;
proxy_cache_lock on;
proxy_cache_lock_timeout 120s;
proxy_cache_lock_age 120s;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
add_header X-Cache-Status $upstream_cache_status always;
# Browsers may keep an answer for an hour as well.
add_header Cache-Control "public, max-age=3600" always;
